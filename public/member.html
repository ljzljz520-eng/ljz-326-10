<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>成员中心 · 机甲纪元赛事官网</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div id="nav-slot"></div>
  <main class="container">
    <div class="page-head">
      <h1 id="hello">成员中心</h1>
      <p>提交报名资料、跟踪审核进度、查看本队排名。</p>
    </div>

    <div class="tabs" id="member-tabs">
      <button data-tab="register" class="active">📝 我的报名</button>
      <button data-tab="ranking">🏅 本队排名</button>
      <button data-tab="profile">⚙️ 账号设置</button>
    </div>

    <!-- 我的报名 -->
    <section class="tab-panel active" id="tab-register">
      <div id="reg-list" class="section" style="padding-top:0"></div>
      <div id="reg-form-wrap" style="display:none">
        <div class="card">
          <h3 id="reg-form-title">提交报名资料</h3>
          <div class="callout info" id="reg-edit-tip" style="display:none">
            报名尚在待审核状态，可修改后重新提交；提交后仍保持待审核。
          </div>
          <form id="form-reg">
            <input type="hidden" name="id">
            <div class="form-grid">
              <div class="form-row">
                <label>队伍名称 <span class="req">*</span></label>
                <input type="text" name="teamName" maxlength="40" placeholder="例如：疾风机器人队" required>
              </div>
              <div class="form-row">
                <label>比赛项目 <span class="req">*</span></label>
                <select name="category" required>
                  <option value="">请选择</option>
                  <option>相扑机器人</option>
                  <option>迷宫机器人</option>
                  <option>任务挑战赛</option>
                </select>
              </div>
            </div>
            <div class="form-grid">
              <div class="form-row">
                <label>队长联系方式 <span class="req">*</span></label>
                <input type="tel" name="contact" required>
              </div>
              <div class="form-row">
                <label>指导老师</label>
                <input type="text" name="advisor" placeholder="选填">
              </div>
            </div>
            <div class="form-row">
              <label>队员名单（2-5 人，至少包含队长）<span class="req">*</span></label>
              <div class="form-grid" id="members-rows"></div>
              <div style="margin-top:6px"><button type="button" class="btn sm ghost" id="btn-add-member">＋ 添加队员</button></div>
            </div>
            <div class="form-row">
              <label>材料说明 / 补充信息</label>
              <textarea name="materials" placeholder="安全责任书、器材清单等材料的说明（演示环境直接填写文字即可）"></textarea>
            </div>
            <button class="btn primary" type="submit" id="reg-submit-btn">提交报名</button>
          </form>
        </div>
      </div>
    </section>

    <!-- 本队排名 -->
    <section class="tab-panel" id="tab-ranking">
      <div id="my-ranking" class="section" style="padding-top:0"></div>
    </section>

    <!-- 账号设置 -->
    <section class="tab-panel" id="tab-profile">
      <div class="grid grid-2">
        <div class="card">
          <h3>资料修改</h3>
          <form id="form-profile">
            <div class="form-row"><label>用户名</label><input type="text" id="p-username" disabled></div>
            <div class="form-row"><label>真实姓名</label><input type="text" name="realName" required></div>
            <div class="form-row"><label>邮箱</label><input type="email" name="email"></div>
            <div class="form-row"><label>手机号</label><input type="tel" name="phone"></div>
            <button class="btn primary" type="submit">保存资料</button>
          </form>
        </div>
        <div class="card">
          <h3>修改密码</h3>
          <form id="form-password">
            <div class="form-row"><label>原密码</label><input type="password" name="oldPassword" required></div>
            <div class="form-row"><label>新密码（至少 6 位）</label><input type="password" name="newPassword" minlength="6" required></div>
            <button class="btn" type="submit">更新密码</button>
          </form>
          <hr style="border-color:var(--line);margin:20px 0">
          <h3>忘记密码？</h3>
          <p class="muted" style="font-size:13.5px">如无法登录，请在登录页「忘记密码」提交申请，由管理员核实后重置。</p>
          <a class="btn sm ghost" href="/login.html#forgot">前往找回密码</a>
        </div>
      </div>
    </section>
  </main>
  <div id="footer-slot"></div>
  <script src="/js/common.js"></script>
  <script src="/js/member.js"></script>
</body>
</html>
